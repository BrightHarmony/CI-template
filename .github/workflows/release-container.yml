name: Reusable Container Release

"on":
  workflow_call:
    inputs:
      runner:
        description: GitHub-hosted or self-hosted runner label.
        type: string
        default: ubuntu-24.04
      registry:
        description: Container registry hostname.
        type: string
        default: ghcr.io
      image_name:
        description: Image path without registry, normally owner/repository.
        type: string
        required: true
      registry_username:
        description: Registry username; empty uses github.actor.
        type: string
        default: ""
      publish_latest:
        description: Add latest for stable releases.
        type: boolean
        default: true
      create_github_release:
        description: Create a GitHub Release with generated notes.
        type: boolean
        default: true
      timeout_minutes:
        description: Maximum runtime for the release job.
        type: number
        default: 15
    secrets:
      registry_token:
        description: Optional registry token; GHCR can use the caller GITHUB_TOKEN.
        required: false
    outputs:
      digest:
        description: Digest promoted by the release.
        value: ${{ jobs.release.outputs.digest }}

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: Promote existing image
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ inputs.timeout_minutes }}
    outputs:
      digest: ${{ steps.promote.outputs.digest }}
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ inputs.registry }}
          username: ${{ inputs.registry_username || github.actor }}
          password: ${{ secrets.registry_token || github.token }}

      - name: Promote commit image
        id: promote
        env:
          IMAGE: ${{ inputs.registry }}/${{ inputs.image_name }}
          PUBLISH_LATEST: ${{ inputs.publish_latest }}
          RELEASE_TAG: ${{ github.ref_name }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [[ ! "$RELEASE_TAG" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tag must look like v1.2.3 or v1.2.3-rc.1" >&2
            exit 1
          fi

          major="${BASH_REMATCH[1]}"
          minor="${BASH_REMATCH[2]}"
          prerelease="${BASH_REMATCH[4]:-}"
          version="${RELEASE_TAG#v}"
          source_ref="$IMAGE:sha-$SOURCE_SHA"
          target_refs=("$IMAGE:$version")

          if [[ -z "$prerelease" ]]; then
            target_refs+=("$IMAGE:$major.$minor" "$IMAGE:$major")
            if [[ "$PUBLISH_LATEST" == "true" ]]; then
              target_refs+=("$IMAGE:latest")
            fi
          fi

          tag_args=()
          for target_ref in "${target_refs[@]}"; do
            tag_args+=(--tag "$target_ref")
          done

          docker buildx imagetools create "${tag_args[@]}" "$source_ref"
          digest="$(docker buildx imagetools inspect "$source_ref" | awk '$1 == "Digest:" {print $2; exit}')"

          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Could not resolve digest for $source_ref" >&2
            exit 1
          fi

          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          printf 'Promoted %s to:\n' "$source_ref"
          printf '  %s\n' "${target_refs[@]}"

      - name: Create GitHub Release
        if: ${{ inputs.create_github_release }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" --verify-tag --generate-notes --title "$RELEASE_TAG"

  release-gate:
    name: Release Gate
    if: ${{ always() }}
    needs:
      - release
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 2
    steps:
      - name: Evaluate release job
        env:
          RELEASE_RESULT: ${{ needs.release.result }}
        run: |
          set -euo pipefail
          if [[ "$RELEASE_RESULT" != "success" ]]; then
            echo "Container release result: $RELEASE_RESULT" >&2
            exit 1
          fi
