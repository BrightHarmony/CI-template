name: Template Self Test

"on":
  pull_request:
  push:
    branches:
      - main
  merge_group:
    types:
      - checks_requested
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: template-self-test-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  repository-policy:
    name: Repository policy
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Validate workflow semantics with actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          install_dir="$RUNNER_TEMP/actionlint"
          curl --fail --silent --show-error --location --retry 3 \
            --output "$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "$ACTIONLINT_SHA256  $archive" | sha256sum --check --strict
          mkdir -p "$install_dir"
          tar -xzf "$archive" -C "$install_dir"
          "$install_dir/actionlint" -color
      - name: Validate repository
        run: bash scripts/validate-repository.sh

  node-fixture:
    name: Node fixture
    uses: ./.github/workflows/ci-node.yml
    with:
      node_version: "24"
      working_directory: tests/fixtures/node
      cache_dependency_path: tests/fixtures/node/package-lock.json
      install_command: npm ci
      lint_command: npm run lint
      typecheck_command: npm run typecheck
      test_command: npm test
      build_command: npm run build

  python-fixture:
    name: Python fixture
    uses: ./.github/workflows/ci-python.yml
    with:
      python_versions_json: '["3.11"]'
      working_directory: tests/fixtures/python
      install_command: uv sync --frozen --no-install-project
      lint_command: python -m compileall -q src tests
      format_command: ""
      typecheck_command: ""
      test_command: python -m unittest discover -s tests -v
      build_command: ""

  security-fixture:
    name: Security
    uses: ./.github/workflows/security.yml
    permissions:
      contents: read
      pull-requests: read
      security-events: write
    with:
      codeql_languages_json: '["javascript-typescript"]'

  container-fixture:
    name: Container
    uses: ./.github/workflows/build-container.yml
    with:
      context: tests/fixtures/docker
      dockerfile: tests/fixtures/docker/Dockerfile

  template-gate:
    name: Template Gate
    if: ${{ always() }}
    needs:
      - repository-policy
      - node-fixture
      - python-fixture
      - security-fixture
      - container-fixture
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Evaluate template checks
        env:
          POLICY_RESULT: ${{ needs.repository-policy.result }}
          NODE_RESULT: ${{ needs.node-fixture.result }}
          PYTHON_RESULT: ${{ needs.python-fixture.result }}
          SECURITY_RESULT: ${{ needs.security-fixture.result }}
          CONTAINER_RESULT: ${{ needs.container-fixture.result }}
        run: |
          set -euo pipefail
          for result in \
            "$POLICY_RESULT" \
            "$NODE_RESULT" \
            "$PYTHON_RESULT" \
            "$SECURITY_RESULT" \
            "$CONTAINER_RESULT"; do
            if [[ "$result" != "success" ]]; then
              echo "A template check ended with: $result" >&2
              exit 1
            fi
          done
