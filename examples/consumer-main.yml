name: Publish main image

"on":
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: publish-main
  cancel-in-progress: false

jobs:
  ci:
    name: CI
    uses: YOUR_ORG/ci-template/.github/workflows/ci-node.yml@PINNED_TEMPLATE_SHA
    with:
      node_version: "24"
      package_manager: npm
      cache_dependency_path: package-lock.json
      install_command: npm ci
      lint_command: npm run lint
      typecheck_command: npm run typecheck
      test_command: npm test
      build_command: npm run build

  security:
    name: Security
    uses: YOUR_ORG/ci-template/.github/workflows/security.yml@PINNED_TEMPLATE_SHA
    permissions:
      contents: read
      pull-requests: read
      security-events: write
    with:
      enable_dependency_review: false
      codeql_languages_json: '["javascript-typescript"]'

  publish:
    name: Publish
    needs:
      - ci
      - security
    uses: YOUR_ORG/ci-template/.github/workflows/publish-container.yml@PINNED_TEMPLATE_SHA
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    with:
      image_name: ${{ github.repository }}
